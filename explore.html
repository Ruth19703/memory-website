<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <section class="cards-section">

    <h2>Friendship Memories</h2>

    <div class="cards-container">

        <div class="card">
            <img src="images/culture.gpj.webp" alt="culture">

            <div class="card-content">
                <h3>Culture</h3>
                <p>
                   “Tradition is the bridge between our past and our future.”
                </p>
                <a href="#" class="card-button">Explore</a>
            </div>
        </div>


        <div class="card">
            <img src="images/nature.gpj.webp" alt="nature">

            <div class="card-content">
                <h3>Nature</h3>
                <p>
                    “The beauty of nature is proof that life is still worth admiring.”
                </p>
                <a href="#" class="card-button">Explore</a>
            </div>
        </div>


        <div class="card">
            <img src="images/sunset.gpj.webp" alt="sunset">">

            <div class="card-content">
                <h3>Sunset</h3>
                <p>
                    “The sky reminds me that letting go can still be beautiful.”
                </p>
                <a href="#" class="card-button">Explore</a>
            </div>
        </div>

    </div>

</section>

    
</body>
</html>
